
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفر کارت تی تی شهر | راهکار رفاهی سازمانی</title>
<script type="text/javascript">
  window.RAYCHAT_TOKEN = "b3c7e2b1-88ed-44dd-8e00-bb67fb0d777f";
  window.LOAD_TYPE = "SEO_FRIENDLY";
  (function () {
    d = document;
    s = d.createElement("script");
    s.src = "https://widget-react.raychat.io/install/widget.js";
    s.async = 1;
    d.getElementsByTagName("head")[0].appendChild(s);
  })();
</script>
</head>
<body>
  <div class="scroll-progress" id="progress-bar"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Existing intersection observer
    window.addEventListener('scroll', () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.reveal-on-scroll').forEach((el) => observer.observe(el));
    });

    // Scroll Progress Logic
    function updateScrollProgress() {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;

      if (height > 0) {
        const scrolled = (winScroll / height) * 100;
        const progressBar = document.getElementById("progress-bar");
        if (progressBar) {
          progressBar.style.width = scrolled + "%";
        }
      }
    }

    window.addEventListener('scroll', updateScrollProgress);
    // Initial call to set state
    updateScrollProgress();
  </script>
</body>
</html>
